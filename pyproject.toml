[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hard-drive-monitor"
version = "0.1.0"
description = "Hard Drive Monitor - SMART drive health monitor for Linux, macOS and Windows, built on smartmontools"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Richard Reeves", email = "rreeves5@gmail.com" }]
requires-python = ">=3.8"
dependencies = []
keywords = ["smart", "smartctl", "smartmontools", "hard drive", "ssd", "nvme", "disk health"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Environment :: Console",
  "Topic :: System :: Hardware",
  "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
toml = ["tomli>=1.1; python_version < '3.11'"]

[project.scripts]
hdmon = "hard_drive_monitor.cli:main"

[tool.setuptools]
packages = ["hard_drive_monitor"]
