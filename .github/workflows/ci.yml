name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: hdmon-linux-x86_64
            binary: build/hdmon
            cmake_args: -DHDMON_STATIC=ON
          - name: macos-universal
            os: macos-latest
            artifact: hdmon-macos-universal
            binary: build/hdmon
            cmake_args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15'
          - name: windows-x86_64
            os: windows-latest
            artifact: hdmon-windows-x86_64.exe
            binary: build/Release/hdmon.exe
            cmake_args: -A x64
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test the CLI on the synthetic fixtures
        shell: bash
        run: |
          ${{ matrix.binary }} --version
          ${{ matrix.binary }} status --from-json tests/fixtures --color never
          set +e
          ${{ matrix.binary }} check --from-json tests/fixtures --no-alert --no-record --quiet
          rc=$?
          set -e
          test "$rc" = 2   # worst fixture is CRITICAL
          ${{ matrix.binary }} install-service --dry-run --json
          ${{ matrix.binary }} update --help

      - name: Linux - D-Bus notifications + systemd1 calls (private dbus-daemon, libdbus fake services)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev dbus >/dev/null
          tools/dbus-verify/verify.sh build/hdmon | tee dbus.log
          grep -q "Notifications.Notify sig=susssasa{sv}i" dbus.log
          grep -q "Manager.EnableUnitFiles sig=asbb" dbus.log
          grep -q "Manager.StartUnit sig=ss" dbus.log
          grep -q "Manager.DisableUnitFiles sig=asb" dbus.log

      - name: Windows - Task Scheduler COM round trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = & build/Release/hdmon.exe install-service | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw 'install-service failed' }
          if ($out -notmatch 'COM ITaskService') { throw 'did not use the Task Scheduler COM API' }
          $xml = schtasks /Query /TN hard-drive-monitor /XML | Out-String
          if ($xml -notmatch 'hdmonw.exe') { throw 'registered task has no hdmonw.exe action' }
          if ($xml -notmatch 'TimeTrigger') { throw 'registered task has no repeating trigger' }
          $out = & build/Release/hdmon.exe uninstall-service | Out-String
          Write-Output $out
          if ($out -notmatch 'Task Scheduler COM') { throw 'uninstall did not use COM' }
          schtasks /Query /TN hard-drive-monitor 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'task still registered after uninstall' }
          $global:LASTEXITCODE = 0

      - name: Windows - Shell_NotifyIcon alert (informational)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: build/Release/hdmon.exe alert-test

      - name: macOS - launchd via ServiceManagement (informational)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          build/hdmon install-service | tee svc.log
          grep -E "SMJobSubmit|launchctl" svc.log
          launchctl print gui/$(id -u)/com.hard-drive-monitor.check | head -8 || true
          build/hdmon uninstall-service
          build/hdmon alert-test || true

      - name: Linux - check the binary is static
        if: runner.os == 'Linux'
        run: |
          file build/hdmon
          ! ldd build/hdmon

      - name: macOS - check both architectures
        if: runner.os == 'macOS'
        run: lipo -info build/hdmon

      - name: Installer smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist && cp ${{ matrix.binary }} dist/${{ matrix.artifact }}
          export HOME="$(mktemp -d)"
          ./install.sh --no-service --no-sudoers
          bash -lc 'hdmon --version'
          ./uninstall.sh --purge

      - name: Installer smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/hdmon.exe dist/hdmon-windows-x86_64.exe
          Copy-Item build/Release/hdmonw.exe dist/hdmonw-windows-x86_64.exe
          ./install.ps1 -NoService
          $bin = Join-Path $env:LOCALAPPDATA 'hard-drive-monitor\bin'
          & (Join-Path $bin 'hdmon.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'installed hdmon.exe did not run' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($userPath -split ';' | Where-Object { $_ -eq $bin })) { throw 'bin dir not on the user Path' }
          ./uninstall.ps1 -Purge

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release
          cp ${{ matrix.binary }} release/${{ matrix.artifact }}
          if [ "${{ runner.os }}" = "Windows" ]; then cp build/Release/hdmonw.exe release/hdmonw-windows-x86_64.exe; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  gui:
    name: hdmon-gui (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            cmake_args: ""
          - name: macos-universal
            os: macos-latest
            cmake_args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15'
          - name: windows-x86_64
            os: windows-latest
            cmake_args: -A x64
    steps:
      - uses: actions/checkout@v4

      - name: Linux - GTK 3 headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Configure (wxWidgets fetched and linked statically)
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHDMON_BUILD_GUI=ON -DHDMON_WX_FETCH=ON -DHDMON_BUILD_TESTS=OFF ${{ matrix.cmake_args }}

      - name: Build hdmon-gui
        run: cmake --build build --config Release --parallel 4 --target hdmon-gui

      - name: Stage + smoke test
        shell: bash
        run: |
          mkdir -p release
          case "${{ runner.os }}" in
            Linux)
              build/hdmon-gui --version
              file build/hdmon-gui
              cp build/hdmon-gui release/hdmon-gui-linux-x86_64 ;;
            macOS)
              app="build/Hard Drive Monitor.app"
              "$app/Contents/MacOS/Hard Drive Monitor" --version
              lipo -info "$app/Contents/MacOS/Hard Drive Monitor"
              ditto -c -k --keepParent "$app" release/Hard-Drive-Monitor-macos.zip ;;
            Windows)
              ls -la build/Release/hdmon-gui.exe
              cp build/Release/hdmon-gui.exe release/hdmon-gui-windows-x86_64.exe ;;
          esac
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release title
        id: ver
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: "Hard Drive Monitor Beta V ${{ steps.ver.outputs.v }}"
          make_latest: true
          generate_release_notes: true
